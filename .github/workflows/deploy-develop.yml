name: Build and Deploy Backend to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package .NET Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ECSBackendAPI/ECSBackendAPI/ECSBackendAPI.slnx

      - name: Build Solution
        run: dotnet build ECSBackendAPI/ECSBackendAPI/ECSBackendAPI.slnx --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish ECSBackendAPI/ECSBackendAPI/ECS.API/ECS.API.csproj --configuration Release --output ${{ runner.temp }}/publish-app --no-build

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Update Database (Run EF Migrations)
        run: >
          dotnet ef database update 
          --project ECSBackendAPI/ECSBackendAPI/ECS.Infrastructure/ECS.Infrastructure.csproj 
          --startup-project ECSBackendAPI/ECSBackendAPI/ECS.API/ECS.API.csproj 
          --context AppDbContext
          --connection "${{ secrets.SQL_CONNECTION_STRING }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-backend-app
          path: ${{ runner.temp }}/publish-app

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: net-backend-app
          path: ${{ runner.temp }}/publish-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish-app

      - name: Update Azure App Settings (Environment Variables)
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          app-settings-json: |
            [
              {
                "name": "MongoDb__ConnectionString",
                "value": "${{ secrets.MONGO_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "ConnectionStrings__DefaultConnection",
                "value": "${{ secrets.SQL_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "AiService__BaseUrl",
                "value": "https://eye-clinic-system-ai.onrender.com",
                "slotSetting": false
              },
              {
                "name": "Jwt__SecretKey",
                "value": "${{ secrets.JWT_SECRET_KEY }}",
                "slotSetting": false
              },
              {
                "name": "Smtp__Password",
                "value": "${{ secrets.SMTP_PASSWORD }}",
                "slotSetting": false
              }
            ]
