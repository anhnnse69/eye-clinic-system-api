name: Build and Deploy Backend to Azure App Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package .NET Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ECSBackendAPI/ECSBackendAPI/ECSBackendAPI.slnx

      - name: Build Solution
        run: dotnet build ECSBackendAPI/ECSBackendAPI/ECSBackendAPI.slnx --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish ECSBackendAPI/ECSBackendAPI/ECS.API/ECS.API.csproj --configuration Release --output ${{ runner.temp }}/publish-app --no-build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-backend-app
          path: ${{ runner.temp }}/publish-app

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: net-backend-app
          path: ${{ runner.temp }}/publish-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish-app
